<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canada High Commission | Portal</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 90%; max-width: 400px; text-align: center; }
        h2 { color: #d32f2f; margin-top: 0; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #eee; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        .btn { width: 100%; padding: 12px; background: #d32f2f; color: white; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; margin-bottom: 10px; }
        #content { display: none; margin-top: 25px; text-align: left; padding: 20px; background: #f9f9f9; border-radius: 12px; border-left: 6px solid #d32f2f; }
        .welcome-btn { background: #222; margin-bottom: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🇨🇦 Canada High Commission</h2>
        
        <button class="btn welcome-btn" onclick="startPortal()">🔊 সাউন্ড অন করে শুরু করুন</button>

        <div id="main-ui" style="display:none;">
            <p style="color: #666; font-size: 14px;">নিরাপদ অ্যাক্সেসের জন্য কোড দিন</p>
            <input type="password" id="code" placeholder="Enter Secret Code">
            <button class="btn" onclick="check()">পরবর্তী ধাপ</button>
        </div>

        <div id="content">
            <h3 style="color: #d32f2f; text-align: center;">স্বাগতম রাফি!</h3>
            <p><strong>স্কুল:</strong> ইকরচালী স্কুল</p>
            <p><strong>ভিসা স্ট্যাটাস:</strong> অনুমোদন পেয়েছে ✅</p>
        </div>
    </div>

    <script>
        function startPortal() {
            // ইনপুট বক্স দেখাবে
            document.getElementById('main-ui').style.display = 'block';
            document.querySelector('.welcome-btn').style.display = 'none';

            // কথা বলা শুরু করবে
            var msg = new SpeechSynthesisUtterance("কানাডা হাই কমিশন এ আপনাকে স্বাগতম। আপনার কোড দিয়ে সামনের ধাপে এগিয়ে যান।");
            msg.lang = 'bn-BD';
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }

        function check() {
            var input = document.getElementById("code").value;
            if (input === "RAFI2026") {
                document.getElementById("content").style.display = "block";
                var success = new SpeechSynthesisUtterance("কোড সঠিক হয়েছে। অভিনন্দন রাফি।");
                success.lang = 'bn-BD';
                window.speechSynthesis.speak(success);
            } else {
                alert("ভুল কোড!");
                var error = new SpeechSynthesisUtterance("ভুল কোড দিয়েছেন। আবার চেষ্টা করুন।");
                error.lang = 'bn-BD';
                window.speechSynthesis.speak(error);
            }
        }
    </script>
</body>
</html>
