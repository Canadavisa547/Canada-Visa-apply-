<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRCC Global | Canada Secure Node</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff1f1f; --secondary: #00ff88; --bg: #050505; }
        * { box-sizing: border-box; transition: all 0.3s ease; }
        
        body {
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
            background: var(--bg); font-family: 'Hind Siliguri', sans-serif; overflow: hidden;
            color: white;
        }

        /* সাইবার ব্যাকগ্রাউন্ড */
        body::after {
            content: ""; position: absolute; width: 100%; height: 100%;
            background: linear-gradient(rgba(13, 13, 13, 0.8), rgba(13, 13, 13, 0.8)), 
                        url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            z-index: -1;
        }

        .main-frame {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 31, 31, 0.3);
            border-radius: 40px; padding: 40px; width: 95%; max-width: 500px;
            box-shadow: 0 0 50px rgba(255, 31, 31, 0.15); text-align: center;
            position: relative; overflow: hidden;
        }

        .header-box { margin-bottom: 30px; }
        .logo-img { width: 50px; filter: drop-shadow(0 0 10px var(--primary)); margin-bottom: 10px; }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 20px; letter-spacing: 3px; color: var(--primary); margin: 0; }
        
        /* কাস্টম ইনপুট */
        .input-box {
            width: 100%; padding: 18px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px;
            color: var(--secondary); font-size: 22px; text-align: center;
            outline: none; font-family: 'Orbitron', sans-serif; margin-bottom: 20px;
        }
        .input-box:focus { border-color: var(--secondary); box-shadow: 0 0 20px rgba(0, 255, 136, 0.2); }

        .neon-btn {
            width: 100%; padding: 16px; background: none; border: 2px solid var(--primary);
            color: var(--primary); border-radius: 15px; font-weight: bold; cursor: pointer;
            font-family: 'Orbitron', sans-serif; letter-spacing: 2px;
        }
        .neon-btn:hover { background: var(--primary); color: white; box-shadow: 0 0 30px var(--primary); }

        /* সাকসেস সেকশন - ডিজিটাল আইডি */
        #passport-ready { display: none; animation: powerOn 1s ease-out; }
        @keyframes powerOn { from { opacity: 0; filter: brightness(3); } to { opacity: 1; filter: brightness(1); } }

        .id-card {
            background: rgba(255, 255, 255, 0.03); border-radius: 25px; padding: 25px;
            border: 1px solid rgba(0, 255, 136, 0.3); position: relative;
        }

        .scan-line {
            position: absolute; width: 100%; height: 4px; background: var(--secondary);
            top: 0; left: 0; box-shadow: 0 0 20px var(--secondary);
            animation: moveScan 4s infinite linear;
        }
        @keyframes moveScan { 0% { top: 0; } 100% { top: 100%; } }

        .photo-container {
            width: 130px; height: 130px; border-radius: 20px; margin: 0 auto 20px;
            border: 2px solid var(--secondary); padding: 5px; position: relative;
        }
        .photo-container img { width: 100%; height: 100%; border-radius: 15px; object-fit: cover; }

        .data-row {
            display: flex; justify-content: space-between; padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px;
        }
        .label { color: rgba(255,255,255,0.5); text-transform: uppercase; font-size: 10px; }
        .val { color: var(--secondary); font-weight: bold; }

        #glitch-msg { color: var(--secondary); font-family: 'Orbitron', sans-serif; font-size: 12px; margin-top: 15px; }

    </style>
</head>
<body>

    <div class="main-frame">
        <div id="auth-ui">
            <div class="header-box">
                <img src="https://upload.wikimedia.org/wikipedia/commons/d/d9/Flag_of_Canada_%28Pantone%29.svg" class="logo-img">
                <h1>SECURE NODE: RAFI</h1>
            </div>
            
            <button id="activate-btn" class="neon-btn" onclick="bootSystem()">INITIALIZE SYSTEM</button>

            <div id="login-form" style="display:none; margin-top: 20px;">
                <input type="password" id="passCode" class="input-box" placeholder="ENTER KEY">
                <button class="neon-btn" style="border-color: var(--secondary); color: var(--secondary);" onclick="accessGrant()">GRANT ACCESS</button>
            </div>
        </div>

        <div id="passport-ready">
            <h2 style="font-family: 'Orbitron', sans-serif; color: var(--secondary); margin-bottom: 20px;">ACCESS GRANTED</h2>
            <div class="id-card">
                <div class="scan-line"></div>
                <div class="photo-container">
                    <img src="my-photo.jpg" alt="Rafi">
                </div>
                
                <div class="data-row"><span class="label">Identity</span><span class="val">Mohammad Rafi</span></div>
                <div class="data-row"><span class="label">Origin</span><span class="val">Ekarchali School</span></div>
                <div class="data-row"><span class="label">Permit</span><span class="val">Study/Work - Class 9</span></div>
                <div class="data-row"><span class="label">Status</span><span class="val" style="color: #fff; background: #1b5e20; padding: 2px 8px; border-radius: 4px;">ACTIVE</span></div>
            </div>
            <div id="glitch-msg">ENCRYPTED DATA STREAM... SUCCESS</div>
        </div>
    </div>

    <script>
        function speak(text) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'bn-BD'; msg.rate = 0.8; msg.pitch = 1.3;
            window.speechSynthesis.speak(msg);
        }

        function bootSystem() {
            document.getElementById('activate-btn').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
            speak("সিস্টেম ইনিশিয়ালাইজ করা হচ্ছে। রাফি, আপনার সিক্রেট কোডটি প্রবেশ করান।");
        }

        function accessGrant() {
            const code = document.getElementById('passCode').value;
            if (code === "RAFI2026") {
                speak("কোড সঠিক হয়েছে। ডাটাবেস থেকে তথ্য সংগ্রহ করা হচ্ছে। দয়া করে অপেক্ষা করুন।");
                document.getElementById('login-form').innerHTML = "<p style='color:var(--secondary)'>DECRYPTING...</p>";
                
                setTimeout(() => {
                    document.getElementById('auth-ui').style.display = 'none';
                    document.getElementById('passport-ready').style.display = 'block';
                    speak("অভিনন্দন রাফি। আপনার কানাডা ভিসা এবং প্রোফাইল সফলভাবে লোড হয়েছে। এখন আপনার যাত্রা শুরু হতে পারে।");
                }, 3000);
            } else {
                speak("এক্সেস ডিনাইড। ভুল কোড দিয়েছেন। সিস্টেম লক করা হবে।");
                alert("CRITICAL ERROR: UNAUTHORIZED ATTEMPT");
            }
        }
    </script>
</body>
</html>
