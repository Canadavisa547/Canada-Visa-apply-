<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Canada Visa Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f4f4;
            /* কানাডার পতাকার কালার থিম */
            background-image: linear-gradient(135deg, #d32f2f 0%, #ffffff 50%, #d32f2f 100%);
            background-size: cover;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 450px;
            text-align: center;
            border-top: 10px solid #d32f2f;
        }

        h1 { color: #d32f2f; margin-bottom: 5px; font-size: 24px; }
        p.subtitle { color: #555; margin-bottom: 25px; font-size: 14px; }

        .btn {
            width: 100%;
            padding: 14px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover { background: #b71c1c; }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        /* সাকসেস সেকশন ডিজাইন */
        #success-page {
            display: none;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-pic {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid #28a745;
            margin: 20px auto;
            object-fit: cover;
            display: block;
        }

        .success-banner {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .info-card {
            text-align: left;
            background: #fdfdfd;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="login-section">
            <h1>🇨🇦 Canada Visa Portal</h1>
            <p class="subtitle">গভর্নমেন্ট অফ কানাডা - অনলাইন ই-সার্ভিস</p>
            
            <button id="startBtn" class="btn" style="background: #333;" onclick="startApp()">সাউন্ড অন করে শুরু করুন</button>

            <div id="input-area" style="display:none; margin-top:20px;">
                <input type="password" id="passCode" placeholder="আপনার গোপন পাসকোড দিন">
                <button class="btn" onclick="verify()">ভেরিফাই করুন</button>
            </div>
        </div>

        <div id="success-page">
            <div class="success-banner">✔ APPLICATION SUCCESSFUL</div>
            <img src="my-photo.jpg" alt="Rafi's Photo" class="profile-pic">
            <div class="info-card">
                <p><strong>নাম:</strong> মো: রাফি</p>
                <p><strong>স্কুল:</strong> ইকরচালী স্কুল (ভোকেশনাল)</p>
                <p><strong>ক্লাস:</strong> নবম</p>
                <p><strong>স্ট্যাটাস:</strong> ভিসা আবেদন অনুমোদিত ✅</p>
            </div>
            <button class="btn" onclick="location.reload()" style="margin-top:20px; background:#555;">লগ আউট</button>
        </div>
    </div>

    <script>
        // ভয়েস ফাংশন
        function speak(text) {
            var msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'bn-BD';
            msg.rate = 0.9; // কথা বলার গতি
            window.speechSynthesis.speak(msg);
        }

        function startApp() {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('input-area').style.display = 'block';
            speak("কানাডা হাই কমিশন এ আপনাকে স্বাগতম। আপনার কোড দিয়ে সামনের ধাপে এগিয়ে যান।");
        }

        function verify() {
            var code = document.getElementById('passCode').value;
            // তোমার পাসওয়ার্ড
            if (code === "RAFI2026") {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('success-page').style.display = 'block';
                speak("আপনার পাসওয়ার্ড সঠিক হয়েছে। এপ্লাই সাকসেসফুল। অভিনন্দন রাফি।");
            } else {
                alert("ভুল কোড! আবার চেষ্টা করুন।");
                speak("দুঃখিত, আপনার দেওয়া কোডটি ভুল। সঠিক কোড দিয়ে আবার চেষ্টা করুন।");
            }
        }
    </script>

</body>
</html>
