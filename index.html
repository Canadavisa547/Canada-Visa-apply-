<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canada High Commission | Portal</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 90%; max-width: 400px; text-align: center; }
        h2 { color: #d32f2f; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #eee; border-radius: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #d32f2f; color: white; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; }
        #content { display: none; margin-top: 25px; text-align: left; padding: 20px; background: #f9f9f9; border-radius: 12px; border-left: 6px solid #d32f2f; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🇨🇦 Canada High Commission</h2>
        <p style="color: #666; font-size: 14px;">নিরাপদ অ্যাক্সেসের জন্য কোড দিন</p>
        <input type="password" id="code" placeholder="Enter Secret Code">
        <button onclick="check()">পরবর্তী ধাপ</button>

        <div id="content">
            <h3 style="color: #d32f2f;">অভিনন্দন রাফি!</h3>
            <p>আপনার সকল তথ্য যাচাই করা হয়েছে।</p>
            <p><strong>স্কুল:</strong> ইকরচালী স্কুল</p>
            <p><strong>ভিসা স্ট্যাটাস:</strong> প্রক্রিয়াধীন...</p>
        </div>
    </div>

    <script>
        // স্ক্রিনে টাচ করলেই স্বাগতম জানাবে
document.body.addEventListener('click', function() {
    speakWelcome();
}, { once: true }); // একবার টাচ করলেই কাজ করবে

function speakWelcome() {
    var msg = new SpeechSynthesisUtterance("কানাডা হাই কমিশন এ আপনাকে স্বাগতম। আপনার কোড দিয়ে সামনের ধাপে এগিয়ে যান।");
    msg.lang = 'bn-BD';
    msg.volume = 1;
    msg.rate = 1;
    window.speechSynthesis.speak(msg);
}

function check() {
    var input = document.getElementById("code").value;
    if (input === "RAFI2026") {
        document.getElementById("content").style.display = "block";
        var success = new SpeechSynthesisUtterance("কোড সঠিক হয়েছে। আপনাকে স্বাগতম।");
        success.lang = 'bn-BD';
        window.speechSynthesis.speak(success);
    } else {
        alert("ভুল কোড!");
    }
}
            }
        }
    </script>
</body>
</html>
