<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canada Visa Application Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.9)), url('https://www.countryflags.com/wp-content/uploads/canada-flag-png-large.png');
            background-size: cover;
        }

        .main-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 95%;
            max-width: 500px;
            text-align: center;
            border-top: 8px solid #d32f2f;
        }

        .logo { width: 60px; margin-bottom: 15px; }
        h1 { color: #d32f2f; font-size: 24px; margin-bottom: 10px; }
        
        input {
            width: 100%;
            padding: 15px;
            margin: 20px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        /* সাবমিশন সাকসেস পেজ */
        #success-screen {
            display: none;
            text-align: left;
            animation: fadeIn 1s ease;
        }

        .success-header {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 30px;
        }

        .check-icon {
            font-size: 60px;
            color: #4caf50;
            display: block;
            margin-bottom: 10px;
        }

        .report-box {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            border: 1px dashed #ccc;
            line-height: 1.8;
            color: #333;
        }

        .footer-note {
            font-size: 12px;
            color: #777;
            margin-top: 20px;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div id="login-ui">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/d9/Flag_of_Canada_%28Pantone%29.svg" class="logo">
            <h1>Canada Visa Portal</h1>
            <p style="color:#666">আপনার অ্যাপ্লিকেশন স্ট্যাটাস দেখতে কোড দিন</p>
            
            <button id="voiceBtn" class="btn" style="background:#333; margin-bottom:10px;" onclick="startVoice()">ভয়েস সক্রিয় করুন</button>

            <div id="input-area" style="display:none;">
                <input type="password" id="passCode" placeholder="সিক্রেট এক্সেস কোড">
                <button class="btn" onclick="checkStatus()">চেক স্ট্যাটাস</button>
            </div>
        </div>

        <div id="success-screen">
            <div class="success-header">
                <span class="check-icon">✔</span>
                <h2 style="margin:0">Application Successful!</h2>
                <p style="color:#2e7d32; font-weight:bold;">আপনার আবেদন সফলভাবে গৃহীত হয়েছে</p>
            </div>

            <div class="report-box">
                <p><strong>আবেদনকারীর নাম:</strong> মো: রাফি</p>
                <p><strong>স্কুল:</strong> ইকরচালী স্কুল (ভোকেশনাল)</p>
