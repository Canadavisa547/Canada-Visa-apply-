<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canada Immigration | Secure Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('https://images.unsplash.com/photo-1503614472-8c93d56e92ce?auto=format&fit=crop&w=1350&q=80'); /* কানাডার সুন্দর ল্যান্ডস্কেপ */
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }

        /* কাঁচের মতো স্বচ্ছ কার্ড (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            color: white;
            transition: all 0.5s ease;
        }

        .logo { width: 80px; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(255,0,0,0.5)); }
        
        h1 { font-size: 26px; margin: 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        p.tagline { font-size: 14px; opacity: 0.9; margin-bottom: 30px; letter-spacing: 1px; }

        .input-group { position: relative; margin-bottom: 20px; }
        
        input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            text-align: center;
            outline: none;
            transition: 0.3s;
        }
        
        input::placeholder { color: rgba(255,255,255,0.7); font-size: 14px; }
        input:focus { background: rgba(255, 255, 255, 0.3); box-shadow: 0 0 15px rgba(255,255,255,0.2); }

        .btn {
            width: 100%;
            padding: 15px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(211, 47, 47, 0.4);
            transition: 0.3s;
        }

        .btn:hover { transform: translateY(-3px); background: #ff4d4d; }

        /* সাকসেস সেকশন */
        #success-page { display: none; }
        
        .profile-frame {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid #28a745;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(40, 167, 69, 0.5);
        }

        .status-badge {
            background: #28a745;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }

        .info-grid {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
            text-align: left;
            font-size: 15px;
            line-height: 1.8;
        }

        /* লোডিং অ্যানিমেশন */
        #loader { display: none; margin: 20px auto; border: 4px solid #f3f3f3; border-top: 4px solid #d32f2f; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="glass-card">
        <div id="login-ui">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/d9/Flag_of_Canada_%28Pantone%29.svg" class="logo" alt="Canada Logo">
            <h1>IRCC PORTAL</h1>
            <p class="tagline">Government of Canada Services</p>
            
            <button id="startBtn" class="btn" style="background: rgba(0,0,0,0.6);" onclick="initApp()">🔊 পোর্টাল সক্রিয় করুন</button>

            <div id="form-content" style="display:none;">
                <div class="input-group">
                    <input type="password" id="passCode" placeholder="Enter Secure Access Code">
                </div>
                <button class="btn" onclick="verify()">ভেরিফাই এবং লগইন</button>
                <div id="loader"></div>
            </div>
        </div>

        <div id="success-page">
            <div class="status-badge">VISA GRANTED ✅</div>
            <div class="profile-frame">
                <img src="my-photo.jpg" class="profile-pic" alt="User">
            </div>
            <h2 style="margin-bottom: 5px;">মো: রাফি</h2>
            <p style="margin-top: 0; font-size: 13px; opacity: 0.8;">এপ্লিকেশন আইডি: CA-998021</p>
            
            <div class="info-grid">
                <div>🏢 <strong>স্কুল:</strong> ইকরচালী স্কুল (ভোকেশনাল)</div>
                <div>📍 <strong>ঠিকানা:</strong> তারাগঞ্জ, রংপুর</div>
                <div>📅 <strong>ইস্যু তারিখ:</strong> ২৮ জানুয়ারি, ২০২৬</div>
                <div>🛡️ <strong>স্ট্যাটাস:</strong> বায়োমেট্রিক সফল</div>
            </div>
            <button class="btn" onclick="location.reload()" style="margin-top: 20px; background: rgba(255,255,255,0.1); font-size: 14px;">নিরাপদ এক্সিট</button>
        </div>
    </div>

    <script>
        function speak(text) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'bn-BD';
            msg.rate = 0.85;
            msg.pitch = 1.1; // হালকা সুর পরিবর্তন
            window.speechSynthesis.speak(msg);
        }

        function initApp() {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('form-content').style.display = 'block';
            speak("কানাডা ইমিগ্রেশন পোর্টালে আপনাকে স্বাগতম। আপনার গোপন এক্সেস কোডটি প্রদান করুন।");
        }

        function verify() {
            const code = document.getElementById('passCode').value;
            const loader = document.getElementById('loader');
            
            if (code === "RAFI2026") {
                loader.style.display = 'block';
                speak("আপনার তথ্য যাচাই করা হচ্ছে। অনুগ্রহ করে অপেক্ষা করুন।");
                
                setTimeout(() => {
                    loader.style.display = 'none';
                    document.getElementById('login-ui').style.display = 'none';
                    document.getElementById('success-page').style.display = 'block';
                    speak("অভিনন্দন রাফি। আপনার কানাডা ভিসা আবেদনটি সফলভাবে অনুমোদিত হয়েছে।");
                }, 2500);
            } else {
                speak("দুঃখিত, আপনার দেওয়া পাসকোডটি ভুল। আপনার পাগল বন্ধুকে ট্রাই করতে নিষেধ করুন।");
                alert("ACCESS DENIED: Unauthorized User!");
            }
        }
    </script>
</body>
</html>
