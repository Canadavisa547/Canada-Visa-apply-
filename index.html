<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canada Visa Check - Official</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; border-top: 5px solid #d52b1e; }
        img { width: 80px; margin-bottom: 10px; }
        h2 { color: #333; margin-bottom: 20px; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #d52b1e; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #a31f16; }
        #result { margin-top: 20px; font-weight: bold; padding: 15px; border-radius: 5px; display: none; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d9/Flag_of_Canada_%28Pantone%29.svg" alt="Canada Flag">
    <h2>ভিসা স্ট্যাটাস চেক করুন</h2>
    
    <input type="text" id="passport" placeholder="পাসপোর্ট নম্বর দিন" required>
    <input type="text" id="appID" placeholder="অ্যাপ্লিকেশন আইডি দিন" required>
    
    <button onclick="checkStatus()">সার্চ করুন</button>

    <div id="result"></div>
</div>

<script>
    function speak(text) {
        const msg = new SpeechSynthesisUtterance();
        msg.text = text;
        msg.lang = 'bn-BD'; 
        window.speechSynthesis.speak(msg);
    }

    function checkStatus() {
        const passport = document.getElementById('passport').value;
        const appID = document.getElementById('appID').value;
        const resultDiv = document.getElementById('result');

        if(passport === "" || appID === "") {
            speak("দয়া করে সবগুলো ঘর পূরণ করুন");
            alert("সবগুলো বক্স পূরণ করুন");
            return;
        }

        resultDiv.style.display = "block";
        resultDiv.style.backgroundColor = "#fff3cd";
        resultDiv.style.color = "#856404";
        resultDiv.innerHTML = "সার্চ করা হচ্ছে... দয়া করে অপেক্ষা করুন।";
        
        speak("আপনার স্ট্যাটাস চেক করা হচ্ছে, দয়া করে অপেক্ষা করুন");

        setTimeout(() => {
            resultDiv.style.backgroundColor = "#d4edda";
            resultDiv.style.color = "#155724";
            resultDiv.style.border = "1px solid #c3e6cb";
            
            const successText = "অভিনন্দন! আপনার কানাডা ভিসা অনুমোদন করা হয়েছে। আপনার পাসপোর্ট সংগ্রহ করুন।";
            resultDiv.innerHTML = "<strong>স্ট্যাটাস: APPROVED</strong><br>" + successText;
            
            speak(successText);
        }, 3000);
    }
</script>

</body>
</html>
