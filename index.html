<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Canada Visa Portal</title>
    <style>
        /* প্রফেশনাল ব্যাকগ্রাউন্ড */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f4f4;
            background-image: linear-gradient(rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.8)), url('https://www.countryflags.com/wp-content/uploads/canada-flag-png-large.png');
            background-size: cover;
            background-position: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 450px;
            text-align: center;
            border-top: 8px solid #d32f2f; /* কানাডিয়ান লাল */
        }

        h1 { color: #d32f2f; font-size: 22px; margin-bottom: 10px; }
        p.subtitle { color: #555; font-size: 14px; margin-bottom: 25px; }

        /* বাটন ও ইনপুট */
        .btn {
            width: 100%;
            padding: 14px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn:hover { background: #b71c1c; }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        /* সাকসেস সেকশন */
        #success-page {
            display: none;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #28a745;
            margin: 20px auto;
            object-fit: cover;
            display: block;
        }

        .success-msg {
            color: #28a745;
            font-weight: bold;
            font-size: 20px;
        }

        .info-box {
            text-align: left;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container" id="login-card">
        <h1>🇨🇦 Canada Visa Application</h1>
        <p class="subtitle">হাই কমিশন অফ কানাডা - অনলাইন পোর্টাল</p>

        <button id="startBtn" class="btn" style="background: #222;" onclick="initVoice()">ভয়েস অন করে শুরু করুন</button>

        <div id="auth-form" style="display: none;">
            <input type="password" id="passCode" placeholder="আপনার গোপন পাসকোড দিন">
            <button class="btn" onclick="verify()">ভেরিফাই করুন</button>
        </div>

        <div id="success-page">
            <div class="success-msg">✔ Apply Success!</div>
            <img src="my-photo.jpg" alt="Profile Picture" class="profile-pic">
            <div class="info-box">
                <p><strong>আবেদনকারী:</strong> মো: রাফি</p>
                <p><strong>স্কুল:</strong> ইকরচালী স্কুল (ভোকেশনাল)</p>
                <p><strong>অবস্থান:</strong> ইকোরচালি, রংপুর</p>
                <p><strong>স্ট্যাটাস:</strong> আপনার আবেদন সফলভাবে জমা হয়েছে।</p>
            </div>
            <button class="btn" onclick="location.reload()" style="background: #555;">লগ আউট</button>
        </div>
    </div>

    <script>
        function speak(text) {
            var msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'bn-BD';
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }

        function initVoice() {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('auth-form').style.display = 'block';
            speak("কানাডা হাই কমিশন এ আপনাকে স্বাগতম। আপনার কোড দিয়ে সামনের ধাপে এগিয়ে যান।");
        }

        function verify() {
            var code = document.getElementById('passCode').value;
            if (code === "RAFI2026") {
                document.getElementById('auth-form').style.display = 'none';
                document.querySelector('h1').innerText = "অ্যাপ্রুভড";
                document.querySelector('.subtitle').style.display = 'none';
                document.getElementById('success-page').style.display = 'block';
                speak("আপনার পাসওয়ার্ড সঠিক হয়েছে। এপ্লাই সাকসেসফুল। অভিনন্দন রাফি।");
            } else {
                alert("ভুল কোড! আপনার 'পাগল বন্ধু' কি ট্রাই করছে নাকি?");
                speak("দুঃখিত, কোডটি ভুল হয়েছে। আবার চেষ্টা করুন।");
            }
        }
    </script>

</body>
</html>
