<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রাইভেট পোর্টাল</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 50px; background-color: #f0f2f5; }
        .box { background: white; padding: 30px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 90%; max-width: 400px; }
        /* তথ্যগুলো প্রথমে লুকিয়ে রাখার জন্য এই অংশটি গুরুত্বপূর্ণ */
        #content { display: none; margin-top: 20px; text-align: left; padding: 15px; background: #e9f7ef; border-radius: 8px; border-left: 5px solid #28a745; }
        input { padding: 12px; width: 85%; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        button { padding: 12px 25px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background: #218838; }
        h2 { color: #333; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>সিক্রেট কোড দিন</h2>
        <input type="password" id="code" placeholder="এখানে কোড লিখুন"> <br>
        <button onclick="check()">সাবমিট করুন</button>

        <div id="content">
            <h3 style="margin-top: 0;">আপনার গোপন তথ্য:</h3>
            <p><strong>নাম:</strong> রাফি</p>
            <p><strong>স্কুল:</strong> ইকরচালী স্কুল (ভোকেশনাল)</p>
            <p><strong>স্ট্যাটাস:</strong> ভিসা এপ্লিকেশন সফলভাবে সংরক্ষিত।</p>
        </div>
    </div>

    <script>
        function check() {
            var input = document.getElementById("code").value;
            var secretCode = "RAFI@2026"; // তোমার নতুন পাসওয়ার্ড এটি

            if (input === secretCode) {
                document.getElementById("content").style.display = "block";
                alert("অভিনন্দন! আপনার তথ্যগুলো এখন নিচে দেখা যাচ্ছে।");
            } else {
                alert("দুঃখিত! ভুল কোড দিয়েছেন। আবার চেষ্টা করুন।");
            }
        }
    </script>
</body>
</html>
