<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canada Immigration | Secure Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('https://images.unsplash.com/photo-1503614472-8c93d56e92ce?auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }

        /* মেইন কার্ড */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 35px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            color: white;
            position: relative;
        }

        .logo { width: 70px; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(255,0,0,0.5)); }
        h1 { font-size: 24px; margin: 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); color: #fff; }
        p.tagline { font-size: 13px; opacity: 0.8; margin-bottom: 25px; letter-spacing: 1px; }

        input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            color: white;
            font-size: 18px;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn:hover { transform: scale(1.02); background: #ff4d4d; }

        /* সাকসেস সেকশন */
        #success-page { display: none; }

        .visa-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.3);
            position: relative;
            overflow: hidden;
            margin-top: 15px;
        }

        /* স্ক্যানিং এনিমেশন */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #00ff00;
            box-shadow: 0 0 15px #00ff00;
            animation: scan 3s infinite linear;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #28a745;
            margin: 10px auto;
            display: block;
            object-fit: cover;
        }

        .info-grid {
            text-align: left;
            font-size: 13px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
        }

        #loader { display: none; margin: 15px auto; border: 4px solid #f3f3f3; border-top: 4px solid #d32f2f; border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="glass-card">
        <div id="login-ui">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/d9/Flag_of_Canada_%28Pantone%29.svg" class="logo">
            <h1>CANADA IMMIGRATION</h1>
            <p class="tagline">Official Secure Access Portal</p>
            
            <button id="startBtn" class="btn" style="background: #222;" onclick="initApp()">🔊 পোর্টাল সক্রিয় করুন</button>

            <div id="form-content" style="display:none;">
                <input type="password" id="passCode" placeholder="এক্সেস কোড দিন">
                <button class="btn" onclick="verify()">ভেরিফাই করুন</button>
                <div id="loader"></div>
            </div>
        </div>

        <div id="success-page">
            <div style="background: #1b5e20; font-size: 12px; padding: 5px; border-radius: 5px; margin-bottom: 10px;">VISA STATUS: GRANTED ✅</div>
            
            <div class="visa-card">
                <div class="scan-line"></div>
                <img src="my-photo.jpg" class="profile-pic" alt="Rafi">
                <h2 style="margin: 10px 0 0;">মো: রাফি</h2>
                <p style="color: #ffeb3b; font-size: 12px; margin: 0 0 10px;">ID: CA-998021-RF</p>

                <div class="info-grid">
                    <div><small>SCHOOL</small><br>ইকরচালী ভোকেশনাল</div>
                    <div><small>LOCATION</small><br>তারাগঞ্জ, রংপুর</div>
                    <div><small>TYPE</small><br>Study Permit</div>
                    <div><small>EXPIRES</small><br>Jan 2031</div>
                </div>
            </div>
            <button class="btn" onclick="location.reload()" style="margin-top: 20px; background: rgba(0,0,0,0.4);">লগ আউট</button>
        </div>
    </div>

    <script>
        function speak(text) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'bn-BD';
            msg.rate = 0.85; // মিষ্টি মেয়েলি ভয়েস করার জন্য স্পিড কিছুটা কমিয়ে রাখা
            msg.pitch = 1.2; // গলার স্বর কিছুটা চিকন করার জন্য
            window.speechSynthesis.speak(msg);
        }

        function initApp() {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('form-content').style.display = 'block';
            speak("কানাডা হাই কমিশন এ আপনাকে স্বাগতম। আপনার কোড দিয়ে সামনের ধাপে এগিয়ে যান।");
        }

        function verify() {
            const code = document.getElementById('passCode').value;
            const loader = document.getElementById('loader');
            
            if (code === "RAFI2026") {
                loader.style.display = 'block';
                speak("আপনার তথ্য যাচাই করা হচ্ছে। অনুগ্রহ করে অপেক্ষা করুন।");
                
                setTimeout(() => {
                    loader.style.display = 'none';
                    document.getElementById('login-ui').style.display = 'none';
                    document.getElementById('success-page').style.display = 'block';
                    speak("অভিনন্দন রাফি। আপনার ভিসা আবেদনটি সফলভাবে অনুমোদিত হয়েছে।");
                }, 2500);
            } else {
                speak("দুঃখিত, পাসকোডটি সঠিক নয়। আবার চেষ্টা করুন।");
                alert("ACCESS DENIED!");
            }
        }
    </script>
</body>
</html>
