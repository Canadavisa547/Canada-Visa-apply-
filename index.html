<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canada Visa Official Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; border-top: 8px solid #d52b1e; }
        .flag { width: 70px; margin-bottom: 10px; }
        h2 { color: #d52b1e; margin: 5px 0; font-size: 22px; }
        .sub-title { color: #666; font-size: 13px; margin-bottom: 20px; }
        
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 15px; background: #fafafa; }
        button { width: 100%; padding: 14px; background-color: #d52b1e; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 10px; box-shadow: 0 4px 10px rgba(213, 43, 30, 0.3); }
        
        /* ম্যাপ সেকশন নতুন ভাবে ডিজাইন করা */
        .map-section { margin-top: 15px; border-radius: 12px; overflow: hidden; border: 1px solid #ddd; height: 160px; position: relative; }
        .location-label { font-size: 12px; color: #444; margin-top: 10px; font-weight: bold; }

        /* পপ-আপ ডকুমেন্ট থিম */
        #visa-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; justify-content: center; align-items: center; }
        .visa-card { background: #f9fff9; width: 85%; max-width: 320px; padding: 20px; border-radius: 15px; border: 4px solid #4caf50; position: relative; animation: slideUp 0.5s ease; }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .doc-header { background: #4caf50; color: white; padding: 10px; border-radius: 5px; font-weight: bold; text-align: center; margin-bottom: 15px; font-size: 14px; }
        .info-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; border-bottom: 1px solid #eee; padding-bottom: 5px; text-align: left; }
        .info-row i { color: #d52b1e; width: 15px; }
        
        .status-badge { background: #4caf50; color: white; padding: 6px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; margin: 15px auto; display: block; width: fit-content; }
        .footer-assets { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .qr-code { width: 75px; }
        .seal { width: 70px; opacity: 0.8; filter: drop-shadow(0 0 5px rgba(0,0,0,0.1)); }
        .close-btn { position: absolute; top: -40px; right: 0; color: white; font-size: 35px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d9/Flag_of_Canada_%28Pantone%29.svg" class="flag">
    <h2>Canada Visa Status</h2>
    <p class="sub-title">ইমিগ্রেশন এবং নাগরিকত্ব যাচাইকরণ পোর্টাল</p>
    
    <input type="text" id="passport" placeholder="পাসপোর্ট নম্বর দিন">
    <input type="text" id="appID" placeholder="অ্যাপ্লিকেশন আইডি দিন">
    
    <button onclick="checkVisa()">সার্চ করুন</button>

    <div class="location-label"><i class="fa-solid fa-location-dot" style="color:#d52b1e"></i> টরেন্টো, ওন্টারিও, কানাডা</div>
    <div class="map-section">
        <iframe 
            width="100%" 
            height="100%" 
            src="https://maps.google.com/maps?q=Toronto,Canada&t=&z=13&ie=UTF8&iwloc=&output=embed" 
            frameborder="0" 
            scrolling="no" 
            marginheight="0" 
            marginwidth="0">
        </iframe>
    </div>
</div>

<div id="visa-modal">
    <div class="visa-card">
        <span class="close-btn" onclick="closeModal()">×</span>
        <div class="doc-header">OFFICIAL APPROVAL NOTICE</div>
        
        <div class="info-row"><i class="fa-solid fa-user"></i> <span><strong>নাম:</strong> MD RAFI</span></div>
        <div class="info-row"><i class="fa-solid fa-id-card"></i> <span><strong>পাসপোর্ট:</strong> <span id="resPass"></span></span></div>
        <div class="info-row"><i class="fa-solid fa-plane-departure"></i> <span><strong>ভিসার ধরন:</strong> Student/Vocational</span></div>
        <div class="info-row"><i class="fa-solid fa-calendar-check"></i> <span><strong>মেয়াদ:</strong> ৩০ জানুয়ারি, ২০৩০</span></div>

        <div class="status-badge">STATUS: APPROVED / ভেরিফাইড</div>

        <div class="footer-assets">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=VISA-APPROVED-RAFI-2026" class="qr-code">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d9/Flag_of_Canada_%28Pantone%29.svg/1200px-Flag_of_Canada_%28Pantone%29.svg.png" class="seal">
        </div>
    </div>
</div>

<script>
    function speak(text) {
        const msg = new SpeechSynthesisUtterance();
        msg.text = text;
        msg.lang = 'bn-BD';
        window.speechSynthesis.speak(msg);
    }

    function checkVisa() {
        const pass = document.getElementById('passport').value;
        if(!pass) { alert("পাসপোর্ট নম্বর দিন"); return; }

        speak("টরেন্টো সার্ভার থেকে আপনার তথ্য যাচাই করা হচ্ছে। অনুগ্রহ করে অপেক্ষা করুন।");
        
        setTimeout(() => {
            document.getElementById('resPass').innerText = pass;
            document.getElementById('visa-modal').style.display = 'flex';
            speak("অভিনন্দন রাফি! আপনার কানাডা ভিসা টরেন্টো অফিস থেকে অনুমোদন করা হয়েছে। কিউআর কোডটি চেক করুন।");
        }, 3000);
    }

    function closeModal() {
        document.getElementById('visa-modal').style.display = 'none';
    }
</script>

</body>
</html>
